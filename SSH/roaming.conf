# Public host settings only. Identity handles remain local to each computer.
Host arca cbit-arca 10.31.31.5
    HostName 10.31.31.5
    User tyler
    IdentitiesOnly yes
    IdentityFile ~/.ssh/id_tyler_5cnano

# Default aliases and direct IP connections use the Nano.
Host proxy cbit-reverseproxy 10.31.31.4
    HostName 10.31.31.4
    User tyler
    IdentitiesOnly yes
    IdentityFile ~/.ssh/id_tyler_5cnano

# Explicit NFC aliases avoid waiting for the absent Nano in Windows Security.
Host arca2
    HostName 10.31.31.5
    User tyler
    IdentitiesOnly yes
    IdentityFile ~/.ssh/id_tyler_5cnfc

Host proxy2
    HostName 10.31.31.4
    User tyler
    IdentitiesOnly yes
    IdentityFile ~/.ssh/id_tyler_5cnfc

Host *
